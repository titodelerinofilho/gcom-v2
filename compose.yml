name: ${COMPOSE_PROJECT_NAME:-gcom}

services:
  postgres:
    restart: unless-stopped
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-gcom}
      POSTGRES_USER: ${DATABASE_OWNER_USER:-gcom_owner}
      POSTGRES_PASSWORD: ${DATABASE_OWNER_PASSWORD:?Configure DATABASE_OWNER_PASSWORD}
      DATABASE_USER: ${DATABASE_USER:-gcom_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
      target: runtime
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'
      APP_SECRET: ${APP_SECRET:?Configure APP_SECRET}
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-gcom}
      DATABASE_USER: ${DATABASE_USER:-gcom_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD}
      DATABASE_SERVER_VERSION: ${DATABASE_SERVER_VERSION:-17}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
      ORACLE_DSN: ${ORACLE_DSN:-}
      ORACLE_USER: ${ORACLE_USER:-}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      WINTHOR_749_LOOKUP_ENABLED: ${WINTHOR_749_LOOKUP_ENABLED:-1}
      LOG_REQUESTS: ${LOG_REQUESTS:-1}
      LOG_RESPONSES: ${LOG_RESPONSES:-1}
      LOG_EXCEPTIONS: ${LOG_EXCEPTIONS:-1}
      LOG_DATABASE: ${LOG_DATABASE:-1}
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_var:/app/var
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: docker/node/Dockerfile
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  backup:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: docker/backup/Dockerfile
    environment:
      PGHOST: ${DATABASE_HOST:-postgres}
      PGPORT: ${DATABASE_PORT:-5432}
      PGUSER: ${DATABASE_OWNER_USER:-gcom_owner}
      PGPASSWORD: ${DATABASE_OWNER_PASSWORD:?Configure DATABASE_OWNER_PASSWORD}
      PGDATABASE: ${DATABASE_NAME:-gcom}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backup_data:/backups
    healthcheck:
      test: ['CMD-SHELL', 'test -f /backups/last-success && test $$(find /backups/last-success -mmin -$$(($${BACKUP_INTERVAL_SECONDS} / 60 + 120)) | wc -l) -eq 1']
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 3

  backend-tools:
    profiles: [tools]
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
      target: test
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    working_dir: /app
    environment:
      APP_ENV: test
      APP_DEBUG: '1'
      APP_SECRET: isolated-test-secret
      COMPOSER_HOME: /tmp/composer
      DATABASE_HOST: postgres-test
      DATABASE_PORT: '5432'
      DATABASE_NAME: gcom_test
      DATABASE_USER: gcom_test
      DATABASE_PASSWORD: isolated-test-password
      DATABASE_SERVER_VERSION: '17'
      WINTHOR_749_LOOKUP_ENABLED: '0'
    volumes:
      - ./backend:/app
    networks:
      - default
      - test

  frontend-tools:
    profiles: [tools]
    build:
      context: ./frontend
      dockerfile: docker/node/Dockerfile
      target: dependencies
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    working_dir: /app
    environment:
      npm_config_cache: /tmp/npm-cache
      NEXT_TELEMETRY_DISABLED: '1'
    volumes:
      - ./frontend:/app

  postgres-test:
    profiles: [tools]
    restart: unless-stopped
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: gcom_test
      POSTGRES_USER: gcom_test
      POSTGRES_PASSWORD: isolated-test-password
    volumes:
      - /var/lib/postgresql/data
    networks:
      - test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gcom_test -d gcom_test']
      interval: 1s
      timeout: 5s
      retries: 30

networks:
  test:
    internal: true

volumes:
  postgres_data:
  backend_var:
  backup_data:
